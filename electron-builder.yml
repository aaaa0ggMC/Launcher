appId: com.electron.app
productName: cockpit
directories:
  buildResources: build
files:
  # Whitelist the runtime payload — everything else (docs/, dev tools, the
  # game-icon-pack submodule) is either bundled into out/ by electron-vite or
  # irrelevant at runtime. The main process reads translation JSONs straight
  # off disk (i18n.ts), so the framework + per-ability translation folders are
  # packaged even though the rest of src/ is not.
  - out/**
  - resources/**
  - scripts/**
  - src/main/ui/translations/**
  - src/abilities/*/translations/**
  - src/background/*/translations/**
  - '!**/*.map'
  - '!{docs/**,test*/**,README.md,CHANGELOG.md}'
asarUnpack:
  # scripts/ holds pkexec helper scripts — the main process execFile's them, so
  # they must NOT stay packed inside the asar (can't be executed from there).
  - resources/**
  - scripts/**
win:
  executableName: cockpit
  target:
    - portable
    - nsis
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
