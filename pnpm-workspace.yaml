packages:
  - 'src/abilities/*'
# hustnet (github:aaaa0ggMC/husthelper#path:hustnet) 依赖 hustcore@workspace:*，
# 在本仓库里没有 hustcore workspace 成员；override 成同仓 git 子路径。
# blockExoticSubdeps:false 允许子依赖走 git（pnpm 11 默认禁止）。
overrides:
  hustcore: github:aaaa0ggMC/husthelper#path:hustcore
  # extract-zip@2（electron 的 postinstall 用它解压）依赖的 yauzl@2 在 Node 26 上会静默失败：
  # Promise 永不 resolve、进程以 0 退出，dist 只解出一个文件 → 启动报 "Electron uninstall"。yauzl@3 正常。
  yauzl: ^3.0.0
blockExoticSubdeps: false
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  usocket: true
onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller
patchedDependencies:
  electron: patches/electron.patch
