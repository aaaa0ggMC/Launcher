plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.linuxcockpit.client'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.linuxcockpit.client'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 自用：没有配置正式签名时用 debug 签名，装得上即可
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
